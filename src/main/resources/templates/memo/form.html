<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">

<section layout:fragment="contents" class="contents d-flex justify-content-center">
    <div class="contents-box my-5">
        <h2 class="text-center">메모 작성</h2>

        <input type="text" class="form-control mt-4" placeholder="제목을 입력하세요">
        <textarea class="form-control mt-2" rows="12" placeholder="내용을 입력하세요"></textarea>
        <input type="file" class="mt-2">
        <div class="d-flex justify-content-between mt-4">
            <a href="/memo/list" class="btn btn-secondary">목록으로</a>
            <button type="button" class="btn btn-secondary">저장</button>
        </div>
    </div>

</section>

</html>
